name: Pulse checks

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, tests and app assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Reanimated's peer range excludes the RN 0.88 prerelease used by SDK 58.
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-app-assets.cjs
      - name: Verify bundled and public policy drafts match
        run: python3 scripts/generate-legal-pages.py --check

  bundles:
    name: iOS, Android and web bundle compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Compile-only values: this job cannot connect to the live backend.
      EXPO_PUBLIC_SUPABASE_URL: https://pulse-ci.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_compile_only_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Compile bundles without EAS Build or submission
        run: npx --no-install expo export --platform all --output-dir ci-export
      - name: Record verification scope
        run: |
          echo '### Pulse bundle compilation' >> "$GITHUB_STEP_SUMMARY"
          echo 'iOS/Android JavaScript and web bundles compiled with dummy backend values. This is not a signed native build, a TestFlight submission, or a deployable app.' >> "$GITHUB_STEP_SUMMARY"
