name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      # Temporary while Expo SDK 58 targets the RN 0.88 release candidate:
      # Reanimated 4.7 tests RN 0.88 RC but its npm peer range excludes prerelease semver.
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Validate iOS home-screen icon PNG
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image
          with Image.open('assets/icon.png') as icon:
              icon.load()
              assert icon.size == (1024, 1024), f'Unexpected size: {icon.size}'
              assert icon.mode == 'RGB', f'Expected RGB, got {icon.mode}'
              assert icon.format == 'PNG', f'Expected PNG, got {icon.format}'
              print('Pulse native icon decoded successfully: 1024x1024 RGB PNG')
          PY
